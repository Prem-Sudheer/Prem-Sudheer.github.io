<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prem Sudheer</title>
  <meta name="description" content="Prem Sudheer — personal profile." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --cream: #f3ead9;
      --gold: #d9b878;
      --gold-soft: rgba(217, 184, 120, 0.85);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: #0a0a0a;
      overflow-x: hidden;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Extra document height is what gives the background room to pan; it holds no visible content. */
    .scroll-space {
      height: 180vh;
    }

    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: auto;
      max-width: none;
      z-index: 0;
      background: #0a0a0a;
      will-change: transform;
    }

    main {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      padding: 40px 36px;
      border-radius: 24px;
      text-align: center;
      background: rgba(9, 11, 15, 0.6);
      border: 1px solid rgba(217, 184, 120, 0.22);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
      animation: rise 0.8s ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0;
      color: var(--cream);
      font-family: "Fraunces", Georgia, serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.3px;
      text-transform: lowercase;
    }

    .tagline {
      margin: 12px 0 0;
      color: var(--gold-soft);
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: 15.5px;
      letter-spacing: 0.2px;
      text-transform: lowercase;
    }

    .links {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a.link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      color: var(--cream);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(217, 184, 120, 0.3);
      transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }

    a.link:hover {
      background: rgba(217, 184, 120, 0.14);
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    a.link svg { width: 19px; height: 19px; flex-shrink: 0; }

    @media (prefers-reduced-motion: reduce) {
      .panel { animation: none; }
    }

    @media (max-width: 480px) {
      main { padding: 20px; }

      .panel {
        max-width: 260px;
        padding: 24px 20px;
        border-radius: 20px;
      }

      h1 { font-size: 23px; }

      .tagline {
        font-size: 12px;
        margin-top: 8px;
      }

      .links {
        margin-top: 18px;
        gap: 8px;
      }

      a.link { width: 38px; height: 38px; }

      a.link svg { width: 16px; height: 16px; }
    }
  </style>
</head>
<body>
  <img
    class="bg-image"
    src="assets/bg.jpg"
    alt=""
  />

  <main>
    <div class="panel">
      <h1>Prem Sudheer</h1>
      <p class="tagline">still becoming. more soon.</p>
      <div class="links">
        <a class="link" href="mailto:premsudheer9999@gmail.com" aria-label="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>
        </a>
        <a class="link" href="https://www.linkedin.com/in/prem-sudheer/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.94 5a1.94 1.94 0 1 1-3.88 0 1.94 1.94 0 0 1 3.88 0ZM3.34 8.75h3.2V21h-3.2V8.75Zm5.6 0h3.07v1.68h.04c.43-.8 1.47-1.65 3.02-1.65 3.23 0 3.83 2.13 3.83 4.9V21h-3.2v-5.62c0-1.34-.02-3.06-1.86-3.06-1.87 0-2.16 1.46-2.16 2.96V21h-3.2V8.75Z"/>
          </svg>
        </a>
        <a class="link" href="https://x.com/Premsudheer_" target="_blank" rel="noopener noreferrer" aria-label="X">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </a>
      </div>
    </div>
  </main>

  <div class="scroll-space"></div>

  <script>
    (function () {
      var img = document.querySelector('.bg-image');

      function pan() {
        var docMax = document.documentElement.scrollHeight - window.innerHeight;
        var progress = docMax > 0 ? Math.min(1, Math.max(0, window.scrollY / docMax)) : 0;
        var overflow = Math.max(0, img.offsetWidth - window.innerWidth);
        img.style.transform = 'translateX(' + (-progress * overflow) + 'px)';
      }

      window.addEventListener('scroll', pan, { passive: true });
      window.addEventListener('resize', pan);

      if (img.complete) {
        pan();
      } else {
        img.addEventListener('load', pan, { once: true });
      }
    })();
  </script>
</body>
</html>
